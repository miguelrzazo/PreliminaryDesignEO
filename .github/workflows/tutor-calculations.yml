name: Tutor review calculations
on:
  push:
    branches: [fix/tutor-review-calculations]
    paths:
      - 'MATLAB_Code/**'
      - '.github/workflows/tutor-calculations.yml'
permissions:
  contents: read
concurrency:
  group: tutor-calculations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
          products: Aerospace_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('MATLAB_Code'); review_calculations
      - name: Package calculation outputs
        if: always()
        run: tar -czf tutor-review-calculations.tar.gz review-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutor-review-calculations
          path: tutor-review-calculations.tar.gz
          if-no-files-found: error
