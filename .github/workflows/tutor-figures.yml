name: Tutor review figures
on:
  push:
    branches: [fix/tutor-review-calculations]
    paths:
      - 'MATLAB_Code/publish_thesis_figures.m'
      - '.github/workflows/tutor-figures.yml'
permissions:
  contents: write
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tutor-review-calculations
          run-id: 41822472658
          github-token: ${{ github.token }}
      - run: tar -xzf tutor-review-calculations.tar.gz
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('MATLAB_Code'); publish_thesis_figures
      - name: Commit regenerated figures and data to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Latex_Code/review_figures 'Compiled data/TutorReview' Latex_Code/zzAnnex/TablasAnnex/review_designs.tex
          git diff --cached --quiet || git commit -m 'docs: regenerate thesis figures from verified MATLAB run'
          git push
