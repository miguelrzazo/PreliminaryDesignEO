[metadata]
name = eo-mission
version = 0.1.0
description = Earth Observation satellite mission design and optimization tool

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.26
    scipy>=1.11
    pandas>=2.1
    matplotlib>=3.8
    PyYAML>=6.0

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=7.4
    pytest-cov
notebook =
    jupyterlab
    ipykernel

[options.entry_points]
console_scripts =
    eo-mission = eo_mission.cli:main
