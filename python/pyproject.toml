[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eo-mission"
version = "0.1.0"
description = "Earth Observation satellite mission design and optimization tool"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "orekit>=12.0",
    "jpype1>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]
notebook = ["jupyterlab", "ipykernel"]

[project.scripts]
eo-mission = "eo_mission.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
